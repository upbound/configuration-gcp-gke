apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: gke.gcp.platform.upbound.io
spec:
  scope: Namespaced
  group: gcp.platform.upbound.io
  names:
    kind: GKE
    plural: gke
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  description: GKE configuration parameters.
                  properties:
                    id:
                      type: string
                      description: ID of this Cluster that other objects will use to refer to it.
                    project:
                      type: string
                      description: GCP project ID for the GKE cluster and service account, and used to derive the Workload Identity pool.
                    region:
                      type: string
                      description: Region is the region you'd like your resource to be created in.
                    managementPolicies:
                      description: "ManagementPolicies for resources. Defaults to [\"*\"] which includes all operations (Create, Observe, Update, Delete, LateInitialize). To orphan resources on deletion, use [\"Create\", \"Observe\", \"Update\", \"LateInitialize\"]."
                      type: array
                      items:
                        type: string
                        enum:
                          - "*"
                          - Create
                          - Observe
                          - Update
                          - Delete
                          - LateInitialize
                      default: ["*"]
                    providerConfigName:
                      description: Crossplane ProviderConfig to use for provisioning this resources
                      type: string
                      default: default
                    version:
                      description: Kubernetes version
                      type: string
                      enum:
                        - latest
                        - "1.35"
                        - "1.34"
                        - "1.33"
                        - "1.32"
                      default: "1.34"
                    workloadIdentity:
                      type: object
                      description: Workload Identity configuration parameters.
                      properties:
                        enabled:
                          type: boolean
                          description: Enable Workload Identity on the cluster and node pool.
                          default: true
                      default:
                        enabled: true
                    networkRef:
                      type: object
                      description: >-
                        Name of a Network in this namespace to run in. When set, the cluster is wired
                        from that Network's published status (status.vpc.selfLink,
                        status.subnetwork.selfLink and status.subnetwork.secondaryRanges), and nothing
                        that needs the network is composed until the Network has published them. When
                        unset, the network is found by the networks.gcp.platform.upbound.io/network-id
                        label matching spec.parameters.id, as before.
                      properties:
                        name:
                          type: string
                          minLength: 1
                          description: Name of the Network (gcp.platform.upbound.io/v1alpha1) in this GKE's namespace.
                      required:
                        - name
                    nodes:
                      type: object
                      description: GKE node configuration parameters.
                      properties:
                        count:
                          type: integer
                          description: Desired node count, from 1 to 100.
                        instanceType:
                          type: string
                          description: instance types associated with the Node Group.
                          default: n1-standard-4
                        diskSizeGb:
                          type: integer
                          description: Boot disk size in GB per node; must be >= the node image size (GKE COS images are ~12GB). Defaults to 20.
                          default: 20
                      required:
                        - count
                        - instanceType
                  required:
                    - id
                    - region
                    - managementPolicies
                    - providerConfigName
                    - nodes
              required:
                - parameters
            status:
              description: A Status represents the observed state
              properties:
                gke:
                  description: >-
                    Status information for the GKE cluster, for higher-level configurations to read
                    instead of composing their own observe-only resources. The fields below are
                    published by this configuration; others are preserved.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    clusterName:
                      type: string
                      description: Name of the composed Cluster managed resource; spec.parameters.id until it is observed.
                    project:
                      type: string
                      description: GCP project of the cluster; spec.parameters.project, else the project of the observed service account or cluster.
                    workloadPool:
                      type: string
                      description: Workload Identity pool of the cluster, <project>.svc.id.goog.
                    kubeconfigSecretRef:
                      type: object
                      description: Secret holding the cluster's kubeconfig.
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        name:
                          type: string
                          description: Name of the Secret, <GKE name>-connection.
                        namespace:
                          type: string
                          description: Namespace of the Secret, this GKE's namespace.
                        key:
                          type: string
                          description: Key of the kubeconfig in the Secret.
                    nodePool:
                      type: object
                      description: The node pool as it is running.
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        instanceType:
                          type: string
                          description: Machine type of the nodes; spec.parameters.nodes.instanceType until the node pool is observed.
              type: object
